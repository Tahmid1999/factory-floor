# The container is capped at 256 MB. RabbitMQ sizes its default watermark from
# the host's RAM, so without this it would apply back pressure only after the
# kernel had already killed it. 200 MB, not the 150 MB first planned: an idle
# broker with these four plugins already holds about 160 MB resident, so a
# 150 MB limit raises the memory alarm at boot and blocks every publisher for good.
vm_memory_high_watermark.absolute = 200MB
